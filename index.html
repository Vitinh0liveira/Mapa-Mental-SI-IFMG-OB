<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa de Carreiras - Sistemas de Informação IFMG</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="app-header">
        <div class="header-container">
            <img src="img/logo-ifmg.png" alt="Logo IFMG" class="header-logo">
            <div class="header-text">
                <h1>Mapa de Carreiras</h1>
                <p>Bacharelado em Sistemas de Informação • <span>IFMG Campus Ouro Branco</span></p>
            </div>
        </div>
    </header>

    

    <main class="main-container">
        <section id="mapa">
            <svg id="conexoes">
                <defs>
                    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                        <path d="M 0 0 L 10 5 L 0 10 z" fill="#027a48" opacity="0.8" />
                    </marker>
                </defs>
            </svg>
            <!-- Áreas renderizadas dinamicamente pelo app.js -->
        </section>
    </main>

    <div id="modal" class="modal oculto">
        <div class="modal-box">
            <button id="modal-fechar" aria-label="Fechar">×</button>
            <h2 id="modal-titulo"></h2>
            <p id="modal-sub"></p>
            <div id="modal-conteudo"></div>
        </div>
    </div>

    <script src="js/app.js"></script>

</body>

</html>
